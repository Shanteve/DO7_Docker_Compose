services:
  postgres:
    image: postgres:18.4-alpine3.23
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql
    networks:
      - services_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - services_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  session-service:
    image: shanteve/session-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  hotel-service:
    image: shanteve/hotel-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  booking-service:
    image: shanteve/booking-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  payment-service:
    image: shanteve/payment-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  loyalty-service:
    image: shanteve/loyalty-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  report-service:
    image: shanteve/report-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  gateway-service:
    image: shanteve/gateway-service:1.0
    env_file:
      - .env
    networks:
      - services_network

  nginx:
    image: nginx:1.30-alpine3.23-slim
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8087:8087"
    networks:
      - services_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  services_network:
    driver: overlay
  
volumes:
  pg_data:
  rabbitmq_data: